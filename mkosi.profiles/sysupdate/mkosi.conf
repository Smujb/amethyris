[Output]
SplitArtifacts=uki,partitions
Format=disk
ManifestFormat=json

[Content]
UnifiedKernelImageFormat=%i_%v_%a
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        audit=0
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:swap=unused+absent:home=absent:=ignore
        systemd.image_filter=usr=%i_%v:usr-verity=%i_%v_verity:usr-verity-sig=%i_%v_verity_sig:root=%i-*
        ipe.enforce=0
        apparmor=1
        lsm=landlock,lockdown,yama,integrity,apparmor,bpf
        console=tty1
        zswap.enabled=0
InitrdProfiles=
KernelInitrdModules=default
Hostname=amethyris
RemoveFiles=
        /boot/*-ucode.img
Bootable=true


[Validation]
SecureBoot=yes
SignExpectedPcr=yes
