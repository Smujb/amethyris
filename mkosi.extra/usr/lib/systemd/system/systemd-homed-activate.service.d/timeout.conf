# see: https://github.com/Lumaeris/stargaze/commit/04cfb7d801b7bb0b2e0e0aa1f5a0d03b591393e9
# systemd-homed doesn't add a timeout for deactivation of home partitions on shutdown,
# so systemd would give it the default 1m30s for it to deactivate everything which
# might not be a lot for unusually large home partitions.
#
# giving it generous 15 minutes timeout just in case.
# if you attempt to use it on machine with hdd then you have bigger problems than this

[Service]
TimeoutSec=900
